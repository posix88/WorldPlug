<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Overridden per-render by render.mjs via page.evaluate — these are just fallbacks. */
    --canvas-w: 1320px;
    --canvas-h: 2868px;
    --caption-size: 92px;
    --caption-max-width: 88%;
    --shot-radius: 56px;
    --shot-top: 21%;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: var(--canvas-w);
    height: var(--canvas-h);
    overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }

  /* Socket Buddy's own cosmic mesh gradient — same family of colors as AppMeshBackground.swift,
     approximated as a static CSS gradient since we can't run the SwiftUI MeshGradient here. */
  .canvas {
    position: relative;
    width: var(--canvas-w);
    height: var(--canvas-h);
    background:
      radial-gradient(circle at 18% 8%,  #2E1F6B 0%, transparent 55%),
      radial-gradient(circle at 85% 12%, #1A144D 0%, transparent 60%),
      radial-gradient(circle at 50% 100%, #141447 0%, transparent 65%),
      linear-gradient(160deg, #0D0A2E 0%, #0A0A24 55%, #1F1447 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Faint bolt-shaped glow behind the caption, echoing the app's own electric-bolt icon
     (Bolt_Top/Bolt_Bottom gradient) without literally drawing a bolt glyph. */
  .glow {
    position: absolute;
    top: 4%;
    left: 50%;
    width: 140%;
    height: 26%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255,214,10,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  .caption-wrap {
    position: relative;
    margin-top: 9%;
    width: var(--caption-max-width);
    text-align: center;
    z-index: 2;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    font-size: calc(var(--caption-size) * 0.28);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #FFD60A;
    text-transform: uppercase;
    margin-bottom: 0.6em;
  }

  .eyebrow::before {
    content: "";
    width: 0.5em;
    height: 0.9em;
    background: linear-gradient(180deg, #FFE633 0%, #FFA600 100%);
    clip-path: polygon(60% 0%, 0% 60%, 45% 60%, 40% 100%, 100% 40%, 55% 40%);
  }

  .caption {
    font-size: var(--caption-size);
    font-weight: 800;
    line-height: 1.08;
    color: #FFFFFF;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .shot-wrap {
    position: absolute;
    top: var(--shot-top);
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    z-index: 2;
    display: flex;
    justify-content: center;
  }

  .shot-frame {
    position: relative;
    border-radius: var(--shot-radius);
    overflow: hidden;
    box-shadow:
      0 70px 140px rgba(0,0,0,0.6),
      0 18px 46px rgba(255,166,0,0.16),
      0 0 0 1.5px rgba(255,255,255,0.16);
    line-height: 0;
  }

  .shot-frame img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="caption-wrap">
      <div class="eyebrow" id="eyebrow">Socket Buddy</div>
      <div class="caption" id="caption">Never pack the wrong plug again</div>
    </div>
    <div class="shot-wrap">
      <div class="shot-frame">
        <img id="screenshot" src="" alt="">
      </div>
    </div>
  </div>
</body>
</html>
